name: Build & Release Zenith Studio Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Zenith CLI Jar
        shell: cmd
        run: .\build-cli.bat

      - name: Package Windows Installer via Pake / Tauri
        shell: pwsh
        run: |
          # Start Zenith Studio server temporarily to allow Pake to extract metadata and assets
          $process = Start-Process -FilePath "java" -ArgumentList "-jar", "bin/zenith.jar", "studio" -PassThru
          Start-Sleep -Seconds 3

          # Package desktop executable
          npx pake-cli http://localhost:3000 --name "ZenithStudio" --title "Zenith Studio PRO" --icon src/main/resources/studio/logo.png --width 1440 --height 900

          # Stop background server
          Stop-Process -Id $process.Id -Force

          # Move and rename installer
          New-Item -ItemType Directory -Force -Path "release"
          Get-ChildItem -Path . -Filter "ZenithStudio*.exe" | Move-Item -Destination "release/Zenith-Studio-Setup.exe"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Studio-Setup-Windows
          path: release/Zenith-Studio-Setup.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Zenith-Studio-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

