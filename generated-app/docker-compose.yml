version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shopsphere_db
      SPRING_DATASOURCE_USERNAME: zenith
      SPRING_DATASOURCE_PASSWORD: zenith_secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shopsphere_db
      POSTGRES_USER: zenith
      POSTGRES_PASSWORD: zenith_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenith -d shopsphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
